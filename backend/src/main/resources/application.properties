spring.datasource.url=jdbc:postgresql://localhost:5432/devcrm
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# JWT
app.jwt.secret=${JWT_SECRET:dev-secret-key-that-you-should-change}
app.jwt.expiration-ms=86400000

# Razorpay
razorpay.key_id=${RAZORPAY_KEY_ID:rzp_test_YOUR_KEY_ID}
razorpay.key_secret=${RAZORPAY_KEY_SECRET:YOUR_KEY_SECRET}
razorpay.webhook_secret=${RAZORPAY_WEBHOOK_SECRET:YOUR_WEBHOOK_SECRET}

server.port=8081
